# Gradle configuration

# JVM flags to improve performance of the build

# Some references: https://openjdk.org/jeps/8359211 (lower Xms is faster JVM startup), https://www.evanjones.ca/java-bytebuffer-leak.html (prevents high native off heap memory), https://www.evanjones.ca/jvm-mmap-pause.html (prevents disk I/O for writing perf counters), https://openjdk.org/jeps/450 (compact object headers), https://openjdk.org/jeps/522 (ParallelGC is faster for pure throughput workloads)

# C2 compiler threads often compete with Gradle threads heavily for CPU-time
# Gradle daemon is not a server application; while it does stay alive between builds and benefit from some optimization (C1-tier) it eventually shutdowns, no need to generate C2 compiled code, so we use TieredStopAtLevel=1

# The JVM option -XX:+PrintFlagsFinal can be used to find out default values of each flag before changing it.
org.gradle.jvmargs=-Xss512k -Xms2m -Xmx2g -Xlog:async -XX:+UseTransparentHugePages -XX:MaxDirectMemorySize=512m -XX:ReservedCodeCacheSize=384m -Djdk.nio.maxCachedBufferSize=262144 -XX:AllocatePrefetchStyle=3 -XX:+UseStringDeduplication -XX:+UseParallelGC -XX:+AllowParallelDefineClass -XX:+PerfDisableSharedMem -XX:+DisableExplicitGC -Djdk.util.jar.enableMultiRelease=force -Djava.net.preferIPv4Stack=true -Duser.language=en -Duser.country=US -XX:-PrintWarnings -XX:ThreadPriorityPolicy=1 -XX:TieredStopAtLevel=1 -XX:+HeapDumpOnOutOfMemoryError -XX:+UnlockExperimentalVMOptions -XX:+TrustFinalNonStaticFields -XX:+IgnoreUnrecognizedVMOptions -XX:+UseCompactObjectHeaders

# Forking a dedicated process for Kotlin causes double JIT warmup and double the memory usage
# Each JVM also has its own JIT caches and native off-heap memory, causing unnecessary resource usage.
kotlin.compiler.execution.strategy=in-process

# Incremental compilation speeds up builds heavily.
kotlin.incremental=true
ksp.incremental=true
ksp.incremental.intermodule=true

# Run tasks in parallel when possible
org.gradle.parallel=true

# Enable the build cache
org.gradle.caching=true

# Only configure tasks when they are needed
org.gradle.configureondemand=true

# loom
fabric.loom.dropNonIntermediateRootMethods=true

# DGT
dgt.minecraft.revision=7

# We set up everything ourselves
dgt.loom.minecraft.setup=false
dgt.loom.mappings.use=false
dgt.loom.loader.use=false

# Mod properties
mod.name=SBO
mod.id=sbo
mod.version=0.7.1
mod.group=net.sbo.mod
mod.description=SBO is the ultimate diana mod for Hypixel Skyblock! FPS friendly, and packed with QOL features!

# Dependencies

# MC version constraints
# undefined is assumed to be compatible updates allowed, e.g., 26.2 being ~26.2.

# We build for 26.1.2 but target ~26.1 so that users using 26.1.1 or 26.1 can also use the mod.
mc26.1.2.constraint=~26.1

# MC 26.1 does not have Sodium Extra 0.9.2 officially supported, only MC 26.1.2 has it, so we need this.
# Users using 26.1 and Sodium Extra 0.8.7 should not disable the Diana-relevant particles as it will cancel particles at network layer instead of render layer, causing issues with solvers. We can't enforce Sodium Extra 0.9.2 which cancels only at the render layer on 26.1.
sodium.extra.breaks.constraint=<0.9.2
mc26.1.2.sodium.extra.breaks.constraint=<0.8.7

# Java
java.version.26.1.2=25
java.version.26.2=25
java.version.26.3=25

# Fabric Loader
fabricloader.version=0.20.0

# Prism and Modrinth Launchers don't make it easy for users to update the loader, even though it is always backwards compatible with all MC versions, for example if you use a Modpack, you would have to unlink from the modpack to update the loader over what loader version the modpack requires as a minimum baseline.
# The official Fabric Intaller often also does not open with the latest Fabric Loader version selected for install until enough time passes for it to be considered "stable".

# So we compile with the latest Loader, but we do not require the latest loader until majority of the people have already upgraded to the new loader version.
fabricloader.constraint=0.19.5

# Fabric Language Kotlin
fabriclanguagekotlin.version=1.14.2+kotlin.2.4.21

# Fabric API
fabricapi.version.26.1.2=0.155.3+26.1.2
fabricapi.version.26.2=0.161.0+26.2
fabricapi.version.26.3=0.162.0+26.3

# hm-api
hmapi.version.26.1.2=1.0.3+26.1
hmapi.version.26.2=1.0.4+26.2
hmapi.version.26.3=1.0.5+26.3

# RenderChest
# (not available and not used for 26.1.2)
renderchest.version.26.2=1.0.3+26.2
renderchest.version.26.3=2.0.0-beta.1+26.3

# Mod Menu
modmenu.version.26.1.2=18.0.2
modmenu.version.26.2=20.0.3
modmenu.version.26.3=21.0.0

# Iris
iris.version.26.1.2=1.11.4
iris.version.26.2=1.11.4
iris.version.26.3=1.11.7

# Sodium (compile only, for showing Hub fake chunks with Sodium)
sodium.version.26.1.2=0.9.2
sodium.version.26.2=0.9.2
sodium.version.26.3=0.9.2

# Sound support
vorbis.version=1.2.1
jlayer.version=1.0.1.4

# AutoService
autoservice.version=1.2.0

# GuiLib (https://github.com/SkyblockOverhaul/SBO-GuiLib)
guilib.version=0.12.6

# DevAuth
devauth.version=1.2.2
